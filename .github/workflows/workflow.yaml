name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export repo variables
        run: echo '${{ toJSON(vars) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
      # Must run after the variables are exported: sync bakes the PUBLIC_* ambient types
      # from the env it can see.
      - run: pnpm exec svelte-kit sync
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run test
